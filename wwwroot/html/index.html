<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Manager - Lab13</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>📦 Item Manager</h1>
        <p class="subtitle">Управление элементами через REST API</p>
        
        <div class="form-section">
            <h2>➕ Create / Edit Item</h2>
            <form id="itemForm">
                <div class="form-group">
                    <label for="itemName">Name *</label>
                    <input type="text" id="itemName" required placeholder="Enter item name">
                </div>
                <div class="form-group">
                    <label for="itemDesc">Description</label>
                    <textarea id="itemDesc" rows="3" placeholder="Enter description"></textarea>
                </div>
                <button type="submit" id="submitBtn">Create Item</button>
                <button type="button" id="cancelBtn" style="display:none; margin-left:10px;" onclick="resetForm()">Cancel</button>
            </form>
        </div>
        
        <div class="items-list">
            <h2>📋 Items List</h2>
            <div id="itemsList">Loading...</div>
        </div>
    </div>
    
    <script src="/js/app.js"></script>
</body>
</html>
