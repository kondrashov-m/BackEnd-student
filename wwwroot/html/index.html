<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление элементами - Лабораторная работа №13</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>📦 Управление элементами</h1>
        <p class="subtitle">Работа с элементами через REST API</p>
        
        <div class="form-section">
            <h2>➕ Создать / Редактировать элемент</h2>
            <form id="itemForm">
                <div class="form-group">
                    <label for="itemName">Название *</label>
                    <input type="text" id="itemName" required placeholder="Введите название элемента">
                </div>
                <div class="form-group">
                    <label for="itemDesc">Описание</label>
                    <textarea id="itemDesc" rows="3" placeholder="Введите описание"></textarea>
                </div>
                <button type="submit" id="submitBtn">Создать элемент</button>
                <button type="button" id="cancelBtn" style="display:none; margin-left:10px;" onclick="resetForm()">Отмена</button>
            </form>
        </div>
        
        <div class="items-list">
            <h2>📋 Список элементов</h2>
            <div id="itemsList">Загрузка...</div>
        </div>
    </div>
    
    <script src="/js/app.js"></script>
</body>
</html>
